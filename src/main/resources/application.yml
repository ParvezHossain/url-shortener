spring:
  application:
    name: url-shortener
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/urlshortener}
    username: ${POSTGRES_USER:urlshortener}
    password: ${POSTGRES_PASSWORD:urlshortener}
  data:
    redis:
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:1s}
      timeout: ${REDIS_COMMAND_TIMEOUT:1s}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration/postgres

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:false}
    secret: ${RATE_LIMIT_SECRET:7f3c9a2e5b814d06c2a97e4f1b6d83a0e9c5472f8a31c6d5e0b794a2f63d18c}
    management: ${RATE_LIMIT_MANAGEMENT:1}
    redirect: ${RATE_LIMIT_REDIRECT:1}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:1}
  v1-sunset: ${APP_V1_SUNSET:}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  short-code:
    max-original-url-length: 2048
    custom-alias-pattern: "^[a-zA-Z0-9_-]{3,16}$"
  cache:
    redirect:
      permanent-ttl: ${REDIRECT_CACHE_PERMANENT_TTL:PT1H}

springdoc:
  override-with-generic-response: false
  swagger-ui:
    path: /swagger-ui.html

---
spring:
  config:
    activate:
      on-profile: docker
  main:
    banner-mode: "off"
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://postgres:5432/urlshortener}

logging:
  structured:
    format:
      console: ecs

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    hibernate:
      ddl-auto: validate
