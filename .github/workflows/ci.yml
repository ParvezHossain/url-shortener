name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Maven verification and Docker smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: urlshortener-ci
      APP_PORT: '18080'
      POSTGRES_PORT: '25432'
      POSTGRES_DB: urlshortener_ci
      APP_BASE_URL: http://localhost:18080
      E2E_BASE_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify application
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Build and start containers
        run: docker compose up --build --wait --wait-timeout 180
      - name: Verify production-only runtime image
        run: python3 scripts/check-runtime-image.py "$(docker compose images -q app)"
      - name: Check application health
        run: curl --fail --silent --show-error http://localhost:18080/actuator/health
      - name: Install browser for quality checks
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          echo "CHROME_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Browser release, accessibility, and responsive checks
        working-directory: frontend
        run: npm run test:e2e
      - name: Lighthouse quality thresholds
        working-directory: frontend
        run: npm run lighthouse
      - name: Save browser and Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-reports
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/lighthouse-report
            frontend/.lighthouseci
          if-no-files-found: ignore
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
