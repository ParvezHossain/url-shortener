<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple, self-hosted home for shorter links."
    />
    <title>Shortly — A little link goes a long way</title>
    <script>
      try {
        const preference = localStorage.getItem("shortly-theme");
        document.documentElement.dataset.theme =
          preference === "light" || preference === "dark"
            ? preference
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {
        /* CSS follows the system when storage is unavailable. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
